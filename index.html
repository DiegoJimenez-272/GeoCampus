<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Navegador interior 3D del edificio INACAP — encuentra tu destino con nuestra mascota guía interactiva." />
    <title>INACAP Navigator 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="error-overlay" style="display: none; position: fixed; inset: 0; background: #fee2e2; color: #991b1b; padding: 24px; font-family: monospace; z-index: 99999; overflow: auto; border: 4px solid #f87171;">
      <h2 style="margin-bottom: 12px;">🚨 Error Detectado:</h2>
      <pre id="error-text" style="font-size: 14px; white-space: pre-wrap; line-height: 1.5;"></pre>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-text').textContent = 
          message + '\n\nSource: ' + source + '\nLine: ' + lineno + ', Col: ' + colno + 
          (error && error.stack ? '\n\nStack Trace:\n' + error.stack : '');
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
